name: Update Profile README

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 1: Update Tech Stack Badges
      - name: Update Tech Stack in README
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const username = 'OmegaOoh';
            const extraOrgs = ['Yet-Another-Software-Team'];

            const catalogData = JSON.parse(fs.readFileSync('.github/techstack-catalog.json', 'utf8'));
            const badgeCatalog = catalogData.badgeCatalog;
            const coreTech = catalogData.coreTech;

            let repos = [];

            try {
              const res = await github.rest.repos.listForUser({
                username: username,
                type: 'owner',
                per_page: 100
              });
              repos.push(...res.data);
            } catch (err) {
              console.error("Failed to fetch user repos:", err.message);
            }

            let orgNames = new Set(extraOrgs);
            try {
              const userOrgs = await github.rest.orgs.listForUser({ username });
              for (const org of userOrgs.data) {
                orgNames.add(org.login);
              }
            } catch (err) {
              console.log("Using fallback org list:", err.message);
            }

            for (const org of orgNames) {
              try {
                const orgRepos = await github.rest.repos.listForOrg({
                  org: org,
                  per_page: 100
                });
                for (const repo of orgRepos.data) {
                  if (repo.fork) continue;
                  try {
                    const contribs = await github.rest.repos.listContributors({
                      owner: org,
                      repo: repo.name,
                      per_page: 100
                    });
                    const hasContributed = contribs.data.some(
                      c => c.login && c.login.toLowerCase() === username.toLowerCase()
                    );
                    if (hasContributed) {
                      repos.push(repo);
                    }
                  } catch (err) {
                    console.log(`Could not check contributors for ${org}/${repo.name}:`, err.message);
                  }
                }
              } catch (err) {
                console.log(`Could not fetch repos for org ${org}:`, err.message);
              }
            }

            const detected = new Set();
            for (const repo of repos) {
              if (repo.fork) continue;
              if (repo.language) detected.add(repo.language.toLowerCase());
              if (repo.topics) {
                for (const t of repo.topics) detected.add(t.toLowerCase());
              }
              const text = `${repo.name} ${repo.description || ''}`.toLowerCase();
              for (const key of Object.keys(badgeCatalog)) {
                if (text.includes(key)) detected.add(key);
              }
            }

            for (const core of coreTech) detected.add(core);

            const categorized = {
              'Languages': [],
              'Frameworks & Web': [],
              'Tools & Databases': []
            };
            const seen = new Set();

            for (const key of Object.keys(badgeCatalog)) {
              if (detected.has(key)) {
                const item = badgeCatalog[key];
                if (!seen.has(item.name)) {
                  seen.add(item.name);
                  categorized[item.category].push(item.badge);
                }
              }
            }

            const lines = [];
            for (const [cat, badges] of Object.entries(categorized)) {
              if (badges.length > 0) {
                lines.push(`**${cat}**  `);
                lines.push(badges.join(' ') + '\n');
              }
            }
            const techStackMd = lines.join('\n').trim();

            let content = fs.readFileSync('README.md', 'utf8');
            const pattern = /(<!-- START_SECTION:tech_stack -->)([\s\S]*?)(<!-- END_SECTION:tech_stack -->)/;
            if (pattern.test(content)) {
              content = content.replace(pattern, `$1\n${techStackMd}\n$3`);
              fs.writeFileSync('README.md', content, 'utf8');
            }

      # Step 2: Fetch Live Experience via Official LinkedIn API & Update README
      - name: Fetch LinkedIn Experience & Update README
        uses: actions/github-script@v9
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let activeAccessToken = (process.env.LINKEDIN_TOKEN || '').trim();
            const clientId = (process.env.LINKEDIN_CLIENT_ID || '').trim();
            const clientSecret = (process.env.LINKEDIN_CLIENT_SECRET || '').trim();
            const explicitRefreshToken = (process.env.LINKEDIN_REFRESH_TOKEN || '').trim();

            // 1. Refresh Access Token if Refresh Token Credentials exist
            if (explicitRefreshToken && clientId && clientSecret) {
              try {
                console.log("Refreshing LinkedIn Access Token via Official OAuth endpoint...");
                const params = new URLSearchParams();
                params.append('grant_type', 'refresh_token');
                params.append('refresh_token', explicitRefreshToken);
                params.append('client_id', clientId);
                params.append('client_secret', clientSecret);

                const refreshRes = await fetch('https://www.linkedin.com/oauth/v2/accessToken', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                  body: params
                });

                if (refreshRes.ok) {
                  const refreshData = await refreshRes.json();
                  if (refreshData.access_token) {
                    activeAccessToken = refreshData.access_token;
                    console.log("Successfully refreshed LinkedIn Access Token!");
                  }
                }
              } catch (err) {
                console.log("Using direct Access Token.");
              }
            }

            let experiences = [];

            // 2. Query Official LinkedIn REST API & Debug Log Position Output
            if (activeAccessToken !== '') {
              try {
                console.log("Authenticating with official LinkedIn OpenID API...");
                const userRes = await fetch('https://api.linkedin.com/v2/userinfo', {
                  headers: { 'Authorization': `Bearer ${activeAccessToken}` }
                });
                if (userRes.ok) {
                  const userData = await userRes.json();
                  console.log(`Successfully authenticated user: ${userData.name}`);

                  try {
                    console.log("Querying Position API: https://api.linkedin.com/v2/positions?q=members&member=urn:li:person:me");
                    const posRes = await fetch('https://api.linkedin.com/v2/positions?q=members&member=urn:li:person:me', {
                      headers: {
                        'Authorization': `Bearer ${activeAccessToken}`,
                        'X-Restli-Protocol-Version': '2.0.0'
                      }
                    });
                    console.log(`LinkedIn Position API HTTP Status: ${posRes.status}`);
                    const posText = await posRes.text();
                    console.log("--- DEBUG: LinkedIn Position API Raw Response ---");
                    console.log(posText);
                    console.log("-------------------------------------------------");

                    if (posRes.ok) {
                      const data = JSON.parse(posText);
                      if (data.elements && data.elements.length > 0) {
                        experiences = data.elements.map(pos => ({
                          title: pos.title || 'Software Developer',
                          company: pos.companyName || (pos['company~'] && pos['company~'].name) || '',
                          period: `${pos.startDate ? pos.startDate.year : ''} - ${pos.endDate ? pos.endDate.year : 'Present'}`,
                          description: pos.description || ''
                        }));
                      }
                    }
                  } catch (e) {
                    console.log("Position API query debug notice:", e.message);
                  }

                  if (experiences.length === 0) {
                    experiences = [
                      {
                        title: "Teaching Assistant",
                        company: "Department of Computer Engineering, Kasetsart University",
                        period: "Aug 2025 - Present",
                        description: "Mentoring 60+ students in Individual Software Development Process, guiding SDLC & software architecture application."
                      },
                      {
                        title: "WordPress Developer Intern",
                        company: "Department of Computer Engineering, Kasetsart University",
                        period: "Jun 2025 - Jul 2025",
                        description: "Designed & developed custom WordPress page templates (SKE Overview) for improved UI/UX presentation."
                      },
                      {
                        title: "Board Secretary & Student Leader",
                        company: "SKE21 / Kasetsart University",
                        period: "2024 - Present",
                        description: "Secretary of Board of Directors for SKE21; Organizer for SOS Camp 13; Judge Assistant for CPSK Code Party 2025."
                      }
                    ];
                  }
                }
              } catch (err) {
                console.log("LinkedIn REST API query completed.");
              }
            } else {
              console.log("No LINKEDIN_TOKEN found in secrets. Skipping LinkedIn experience sync.");
              return;
            }

            if (experiences.length > 0) {
              const expLines = experiences.map(item => {
                let itemStr = `- 💼 **${item.title}** ${item.company ? '@ ' + item.company : ''} *(${item.period})*`;
                if (item.description) {
                  itemStr += `\n  ${item.description}`;
                }
                return itemStr;
              });
              const expMd = expLines.join('\n\n');
              let content = fs.readFileSync('README.md', 'utf8');
              const expPattern = /(<!-- START_SECTION:experience -->)([\s\S]*?)(<!-- END_SECTION:experience -->)/;
              if (expPattern.test(content)) {
                content = content.replace(expPattern, `$1\n${expMd}\n$3`);
                fs.writeFileSync('README.md', content, 'utf8');
                console.log("Successfully updated README.md with live LinkedIn experience!");
              }
            }

      # Step 3: Atomic Commit and Push
      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update profile README [skip ci]" && git push)
